spring:
    application:
        name: user-service
    config:
        import: "optional:configserver:"
    cloud:
        config:
            uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
            retry:
                max-attempts: 10
                initial-interval: 2000
                max-interval: 5000
                multiplier: 1.5
