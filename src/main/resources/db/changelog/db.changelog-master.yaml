databaseChangeLog:
    - changeSet:
        id: 1
        author: user-service
        changes:
            - createTable:
                tableName: users
                columns:
                    - column:
                        name: id
                        type: BIGINT
                        autoIncrement: true
                        constraints:
                        primaryKey: true
                        nullable: false
                    - column:
                        name: name
                        type: VARCHAR(255)
                    - column:
                        name: age
                        type: INT
                    - column:
                        name: email
                        type: VARCHAR(255)
                    - column:
                        name: password
                        type: VARCHAR(255)
                        constraints:
                            nullable: false
                    - column:
                        name: roles
                        type: JSONB
                        defaultValue: '["USER"]'
                        constraints:
                            nullable: false
                    - column:
                        name: created_at
                        type: TIMESTAMP
                        constraints:
                        nullable: false
