# ДАННЫЕ ПОДКЛЮЧЕНИЯ К БАЗЕ ДАННЫХ
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE & JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LIQUIBASE (миграции)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ЛОГИРОВАНИЕ
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# KAFKA (продюсер событий)
spring.kafka.bootstrap-servers=host.docker.internal:9496
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic.user-events=user-events

# REST FALLBACK НА NOTIFICATION-SERVICE
app.notification-service.url=http://localhost:8083/api/notifications
app.notification-service.connect-timeout=2000
app.notification-service.read-timeout=3000

# SPRING CACHE (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# RATE LIMITING (защита API)
app.rate-limit.max-requests=20
app.rate-limit.window-seconds=60

# HTTPS (самоподписанный сертификат)
server.port=9497
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=user-service

# MANAGEMENT PORT (отдельный, без SSL)
# management.server.port=8081
# management.server.address=127.0.0.1

# APPLICATION INFO
spring.application.name=user-service
info.application.name=${spring.application.name}
info.application.description=REST user service (Spring Boot)
