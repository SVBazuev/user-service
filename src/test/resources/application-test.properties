# Отключаем Spring Cloud инфраструктуру
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.config.import=

# База данных H2 для тестов
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false

# Логирование
logging.level.org.springframework.web=DEBUG

# Отключаем авто-конфигурацию Kafka (чтобы тесты не искали реальный брокер)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Значения для плейсхолдеров (если нужны)
spring.kafka.bootstrap-servers=
app.kafka.topic.user-events=user-events
app.kafka.dlt-topic=user-events-DLT
